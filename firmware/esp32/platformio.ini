; Proyecto: Puente ESP32  (PC <-> ESP32 <-> FPGA)  - Maestro Modbus RTU
; Framework: Arduino
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; USB hacia la HMI. DEBE coincidir con "Baudios" en la interfaz de Python.
monitor_speed = 115200

lib_deps =
    4-20ma/ModbusMaster @ ^2.0.1
